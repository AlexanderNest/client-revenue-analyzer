name: check-coverage-rate.yml

on:
  workflow_run:
    workflows: [ "Java build and test" ]
    types:
      - completed

jobs:
  check-job:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Run jaCoCo check
        run: mvn jacoco:check@check-coverage-rate
